[project]
name = "pp-mcp"
version = "0.1.0"
description = "MCP server for a local Portfolio Performance file: read-only, with optional staged writes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Max van der Linden" }]
requires-python = ">=3.11"
keywords = ["mcp", "portfolio-performance", "portfolio", "investing", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "fastmcp>=4.0,<5",
    "jpype1>=1.7.1,<2",
    "mcp>=2.1,<3",
    "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/MaxvanderLinden/portfolio_performance_mcp"
Issues = "https://github.com/MaxvanderLinden/portfolio_performance_mcp/issues"

[project.scripts]
pp-mcp = "pp_mcp.server:main"
pp-read = "pp_mcp.server:main"  # original name, kept so existing registrations keep working
pp-write = "pp_mcp.server:main_write"  # staged writes; register deliberately, see SAFETY.md

[project.optional-dependencies]
dev = ["pytest>=8", "pyright>=1.1.400", "ruff>=0.12"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pp_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
# JPype has no stubs; its untyped proxies are cast to protocols in src/pp_mcp/jtypes.py.
reportMissingTypeStubs = false
