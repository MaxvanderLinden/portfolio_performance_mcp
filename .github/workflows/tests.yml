name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      # Portfolio Performance is not installed on the runners, so the integration tests skip;
      # config, conversion, platform-discovery and server-import tests still run.
      - run: python -m pytest -q -rs
      - run: for f in scripts/*.sh; do bash -n "$f"; done
